<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The CSE Cheese Society</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/home.css">
  <!--
    GRID HOLY GRAIL
    The full holy grail in ONE grid container — no wrappers, no nesting.
    grid-template-areas draws the layout as ASCII art: header and footer
    span all three columns, nav | main | aside share the middle row.
    Because every region is placed by name, the single media query below
    re-draws the whole page as one column just by rewriting the map.
  -->
  <style>
    body {
      --nav-width: 10rem;
      --aside-width: 12rem;

      display: grid;
      grid-template-areas:
        "header header header"
        "nav    main   aside"
        "footer footer footer";
      grid-template-columns: var(--nav-width) 1fr var(--aside-width);
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;

      > header {
        grid-area: header;
        padding: var(--space-2) var(--space-3);
        border-block-end: var(--border);
        background: var(--panel);
      }

      > nav {
        grid-area: nav;
        padding: var(--space-2);
        border-inline-end: var(--border);
        background: var(--panel);

        ul {
          margin: 0;
          padding: 0;
          list-style: none;
        }
      }

      > main {
        grid-area: main;
        padding: var(--space-3);
      }

      > aside {
        grid-area: aside;
        padding: var(--space-2);
        border-inline-start: var(--border);
        background: var(--panel);
      }

      > footer {
        grid-area: footer;
        padding: var(--space-2) var(--space-3);
        border-block-start: var(--border);
        background: var(--panel);
      }

      @media (max-width: 40rem) {
        grid-template-areas:
          "header"
          "nav"
          "main"
          "aside"
          "footer";
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr auto auto;

        > nav,
        > aside {
          border-inline: none;
          border-block-end: var(--border);
        }
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>The CSE Cheese Society</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="guide/index.html">Guide</a></li>
      <li><a href="join.html">Join</a></li>
    </ul>
  </nav>

  <!-- The Invoker Button -->
  <button commandfor="cheese-fact-popover" command="toggle-popover">
    🧀 Click for a Cheese Fact
  </button>

  <!-- The Popover Element -->
  <div popover id="cheese-fact-popover">
    <h3>Did you know?</h3>
    <p>Gouda accounts for more than 50% of the world's cheese consumption!</p>
  </div>

  <main>
    <h2>Welcome to the CSE Cheese society</h2>
    <p></p>

  </main>

  <aside>
    <p>Cheese of the Month</p>
  </aside>

  <footer>
    <p>Copyright 2026 The CSE Cheese Society. Cheese responsibly.</p>
  </footer>
</body>
</html>
