<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The CSE Cheese Society</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/site.css">
  <!--
    GRID HOLY GRAIL
    The full holy grail in ONE grid container — no wrappers, no nesting.
    grid-template-areas draws the layout as ASCII art: header and footer
    span all three columns, nav | main | aside share the middle row.
    Because every region is placed by name, the single media query below
    re-draws the whole page as one column just by rewriting the map.
  -->

</head>
<body>
  <header>
    <h1>The CSE Cheese Society</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="guide/index.html">Guide</a></li>
      <li><a href="join.html">Join</a></li>
    </ul>
  </nav>

  <main>
    <h2>Welcome to the CSE Cheese society</h2>
    <p></p>

    <!-- Invoker-->
    <button commandfor="cheese-fact-popover" command="toggle-popover">
      🧀 Click for a Cheese Fact
    </button>

    <!-- Popover Element -->
    <div popover id="cheese-fact-popover">
      <h3>Did you know?</h3>
      <p>Gouda accounts for more than 50% of the world's cheese consumption!</p>
    </div>

  </main>

  <aside>
    <p>Cheese of the Month</p>
    <p>Blue Cheese</p>
  </aside>

  <footer>
    <p>Copyright 2026 The CSE Cheese Society. Cheese responsibly.</p>
  </footer>
</body>
</html>
